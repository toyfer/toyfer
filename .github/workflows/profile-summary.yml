name: Profile Summary

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build summary block
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate profile summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: toyfer
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from collections import Counter
          from datetime import date

          user = os.environ.get("GH_USER", "toyfer")
          token = os.environ.get("GH_TOKEN", "")
          headers = {"Accept": "application/vnd.github+json", "User-Agent": "profile-summary"}
          if token:
              headers["Authorization"] = f"Bearer {token}"

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))

          repos = get(f"https://api.github.com/users/{user}/repos?per_page=100&sort=updated")
          own = [r for r in repos if not r.get("fork")]
          langs = Counter((r.get("language") or "Other") for r in own)
          top_langs = ", ".join(f"{k}×{v}" for k, v in langs.most_common(6))
          account = get(f"https://api.github.com/users/{user}")
          created = (account.get("created_at") or "")[:4]
          today = date.today().isoformat()

          def e(s):
              return str(s).replace("|", "\\|")

          lines = [
              f"| Public repos | {len(repos)} |",
              f"| Own repos | {len(own)} |",
              f"| Followers | {account.get('followers', 0)} |",
              f"| Following | {account.get('following', 0)} |",
              f"| Since | {created} |",
              f"| Top languages | {e(top_langs)} |",
              f"| Updated | {today} |",
          ]
          block = "\n".join(lines)

          with open("README.md", encoding="utf-8") as f:
              text = f.read()
          start = "<!-- SUMMARY:START -->"
          end = "<!-- SUMMARY:END -->"
          if start in text and end in text:
              head, rest = text.split(start, 1)
              _, tail = rest.split(end, 1)
              text = head + start + "\n\n| | |\n|---|---|\n" + block + "\n\n" + end + tail
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(text)
          PY

      - name: Commit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update profile summary"
          git push
